<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="A quiet space, currently being redesigned.">
  <title>A Quiet Space — In Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f5f3ed; --ink:#262b26; --muted:#788077; --accent:#617b66; --line:#d8ddd3; }
    *,*::before,*::after { box-sizing:border-box; }
    html { min-height:100%; }
    body { margin:0; min-height:100vh; color:var(--ink); background:var(--bg); font-family:"DM Sans","Noto Sans SC","PingFang SC",sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:inherit; }
    .page { width:min(100% - 72px,1180px); min-height:100vh; margin:auto; display:flex; flex-direction:column; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:38px 0; border-bottom:1px solid var(--line); }
    .mark { width:32px; height:32px; display:grid; place-items:center; border:1px solid #9ba99b; border-radius:50%; font-family:Georgia,serif; color:var(--accent); font-size:20px; transform:rotate(-15deg); }
    .status { display:flex; align-items:center; gap:10px; font-size:10px; line-height:1.6; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:#747f74; }
    .status::before { content:""; width:6px; height:6px; border-radius:50%; background:#829883; }
    main { flex:1; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(310px,.9fr); align-items:center; gap:clamp(45px,7vw,130px); padding:105px 0 110px; }
    .eyebrow { font-size:11px; font-weight:600; color:var(--accent); letter-spacing:.24em; text-transform:uppercase; margin:0 0 33px; }
    h1 { margin:0; font-family:"Fraunces",Georgia,serif; font-size:clamp(58px,7vw,104px); font-weight:400; line-height:1.13; letter-spacing:-.06em; }
    h1 em { font-style:italic; color:var(--accent); }
    .desc { color:#666e65; margin:32px 0 0; max-width:460px; font-size:16px; line-height:2.1; letter-spacing:.015em; }
    .side { display:flex; justify-content:center; align-items:center; position:relative; aspect-ratio:1/1; }
    .side::before { content:""; position:absolute; inset:7%; border-radius:50%; background:radial-gradient(circle,#e6e9df 0%,#f0eee6 57%,transparent 72%); filter:blur(8px); }
    .illustration { position:relative; width:min(100%,420px); aspect-ratio:1; }
    .ring { position:absolute; border:1px solid rgba(95,125,104,.5); border-radius:50%; transform:rotate(-24deg); }
    .ring.r1 { inset:12% 10% 16% 14%; border-style:solid; }
    .ring.r2 { inset:21% 23% 23% 19%; border-color:rgba(129,150,128,.6); transform:rotate(30deg) scaleX(.88); }
    .ring.r3 { inset:31% 29%; border-color:rgba(161,171,149,.55); transform:rotate(-40deg) scaleX(.8); }
    .line { position:absolute; width:1px; background:linear-gradient(transparent,#a7b6a3,transparent); left:50%; top:4%; height:92%; transform:rotate(33deg); }
    .line.l2 { transform:rotate(-57deg); }
    .center { position:absolute; width:12px; height:12px; border-radius:50%; background:#a3b7a3; left:calc(50% - 6px); top:calc(50% - 6px); box-shadow:0 0 0 14px rgba(181,195,174,.24); }
    .point { position:absolute; width:7px; height:7px; border-radius:50%; background:var(--accent); }
    .p1 { left:17%; top:24%; }.p2 { right:12%; top:59%; }.p3 { left:40%; bottom:9%; }
    .fineprint { position:absolute; bottom:1%; left:10%; font-size:10px; letter-spacing:.19em; color:#abb3a7; text-transform:uppercase; }
    footer { display:flex; justify-content:space-between; flex-wrap:wrap; gap:15px; border-top:1px solid var(--line); padding:30px 0 36px; color:#8b968a; font-size:11px; letter-spacing:.08em; }
    @media(max-width:850px) { .page { width:min(100% - 44px,650px); } main { display:flex; flex-direction:column; align-items:stretch; gap:28px; padding:92px 0 80px; } .side { width:min(100%,360px); align-self:center; } .illustration { width:100%; } h1 { font-size:clamp(55px,11vw,82px); } }
    @media(max-width:480px) { .top { padding:25px 0; }.status { font-size:9px; letter-spacing:.1em; } main { padding:75px 0 62px; } .desc { font-size:14px; } .side { width:min(100%,270px); } footer { font-size:10px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="mark" aria-hidden="true">✳</div>
      <div class="status">Under consideration</div>
    </header>
    <main>
      <div>
        <p class="eyebrow">A NEW CHAPTER · COMING SOON</p>
        <h1>A little space<br>to <em>begin again.</em></h1>
        <p class="desc">这个空间正在重新设计。原有内容已暂时隐藏，整理完成后再见。</p>
      </div>
      <div class="side" aria-hidden="true">
        <div class="illustration">
          <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
          <div class="line"></div><div class="line l2"></div><div class="center"></div>
          <div class="point p1"></div><div class="point p2"></div><div class="point p3"></div>
          <span class="fineprint">growing quietly / 001</span>
        </div>
      </div>
    </main>
    <footer><span>WORK IN PROGRESS</span><span>Made with patience and curiosity.</span></footer>
  </div>
</body>
</html>
